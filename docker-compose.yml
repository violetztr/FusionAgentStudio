services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_USER: studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
